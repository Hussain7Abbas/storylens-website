# Static website; build-generated CSP hashes live beside the active export.
server {
    listen 80;
    listen [::]:80;
    server_name storylens.iscoded.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storylens.iscoded.com;
    ssl_certificate /etc/letsencrypt/live/storylens.iscoded.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storylens.iscoded.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/storylens/current;
    index index.html;
    access_log /var/log/nginx/storylens-website.access.log;
    error_log /var/log/nginx/storylens-website.error.log;
    include /var/www/storylens/current/security-headers.conf;
    location = / { return 302 /en/; }
    location / { try_files $uri $uri/ =404; }
    location /_next/static/ { expires 1y; try_files $uri =404; }
    location = /security-headers.conf { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}

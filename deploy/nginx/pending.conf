# Use after certificate issuance while publication is pending.
server {
    listen 80;
    listen [::]:80;
    server_name storylens.iscoded.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storylens.iscoded.com;
    ssl_certificate /etc/letsencrypt/live/storylens.iscoded.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storylens.iscoded.com/privkey.pem;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    add_header X-Robots-Tag "noindex" always;
    default_type text/html;
    return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Lens — Coming soon</title><body><main><h1>Story Lens</h1><p>The website is being prepared. Please check back soon.</p><p lang="ar" dir="rtl">يجري تجهيز الموقع. يرجى العودة قريبًا.</p></main></body></html>';
}

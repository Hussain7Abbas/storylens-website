server {
    listen 80;
    listen [::]:80;
    server_name storylens.iscoded.com;
    root /var/www/storylens/current;
    index index.html;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = / { return 302 /en/; }
    location / { try_files $uri $uri/ =404; }
    location = /security-headers.conf { deny all; }
}

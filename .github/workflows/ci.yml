name: Website quality
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
      - run: bun run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: out

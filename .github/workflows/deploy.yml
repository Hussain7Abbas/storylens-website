name: Deploy production
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storylens-production
  cancel-in-progress: false
jobs:
  quality:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release belongs to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main || { echo 'Release commit must belong to main'; exit 1; }
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
      - run: bun run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-quality-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy verified tag commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_COMMIT: ${{ needs.quality.outputs.commit }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" "deploy $DEPLOY_COMMIT"
